<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حساب ذهني الاحترافي</title>

<!-- PWA Meta Tags -->
<meta name="theme-color" content="#d97706">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">

<!-- Firebase App & Database SDKs (Compat Version for Direct Browser Scripting) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f5f0e8;
  --card:#fff;
  --ink:#1a1208;
  --muted:#8a7a5a;
  --border:#e0d5be;
  --accent:#d97706;
  --accent2:#b45309;
  --green:#16a34a;
  --red:#dc2626;
  --blue:#2563eb;
  --shadow:rgba(0,0,0,0.08);
}

html,body{height:100%;background:var(--bg);font-family:'Cairo',sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
body{display:flex;align-items:center;justify-content:center}

.page{position:relative;z-index:1;width:min(420px,96vw);max-height:98vh;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px}

/* Head Controls */
.top-nav{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.icon-btn{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:6px 12px;font-family:'Cairo',sans-serif;font-size:.8rem;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--border)}

/* Start Page */
.app-title{font-size:1.8rem;font-weight:900;color:var(--ink);text-align:center}
.app-title span{color:var(--accent)}
.credit-box{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:6px 14px;box-shadow:2px 3px 0 var(--border);font-size:.85rem;color:var(--ink);font-weight:700;text-align:center}

.select-group{width:100%;display:flex;flex-direction:column;gap:6px;text-align:right}
.select-label{font-size:.8rem;font-weight:700;color:var(--muted)}
.options-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt-btn{background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:8px 4px;font-family:'Cairo',sans-serif;font-size:.8rem;font-weight:700;color:var(--ink);cursor:pointer;text-align:center}
.opt-btn.active{background:var(--accent);color:#fff;border-color:var(--accent2)}

/* Modals / Sections */
.sec-card{width:100%;background:var(--card);border-radius:12px;border:1.5px solid var(--border);padding:10px;box-shadow:2px 3px 0 var(--border)}
.sec-title{font-size:.9rem;font-weight:900;color:var(--accent);margin-bottom:8px;text-align:center}

/* Game Interface */
.top-strip{width:100%;display:flex;align-items:center;gap:8px}
.chip{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:6px 10px;box-shadow:2px 3px 0 var(--border);text-align:center;flex:1}
.chip .cl{font-size:.6rem;color:var(--muted);font-weight:600}
.chip .cv{font-size:1.1rem;font-weight:900;color:var(--ink)}

.q-card{width:100%;background:var(--card);border-radius:14px;border:1.5px solid var(--border);box-shadow:3px 4px 0 var(--border);padding:10px;text-align:center}
.steps-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px}
.step-num{font-size:1.3rem;font-weight:900;background:#fef9f0;border:1.5px solid var(--border);border-radius:6px;padding:2px 8px}
.step-op{font-size:1.1rem;font-weight:900;padding:2px 6px;border-radius:6px}
.step-op.plus{background:#d1fae5;color:var(--green)}
.step-op.minus{background:#fee2e2;color:var(--red)}
.step-op.mul{background:#dbeafe;color:var(--blue)}

.ans-display{width:100%;background:var(--card);border:2px solid var(--border);border-radius:10px;padding:4px;text-align:center;font-size:1.4rem;font-weight:900;color:var(--muted);min-height:40px;display:flex;align-items:center;justify-content:center}
.ans-display.has-val{color:var(--ink);border-color:var(--accent)}

.ans-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%}
.ans-btn{background:var(--card);border:1.5px solid var(--border);border-radius:6px;font-family:'Cairo',sans-serif;font-size:.85rem;font-weight:700;padding:6px 2px;cursor:pointer}
.ans-btn.selected{background:var(--accent);color:#fff}

.btn-main{width:100%;padding:12px;border-radius:11px;border:none;background:var(--accent);color:#fff;font-family:'Cairo',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--accent2)}
.btn-secondary{background:var(--card);border:1.5px solid var(--border);color:var(--ink);box-shadow:0 2px 0 var(--border)}

/* Leaderboard List */
.lb-list{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow-y:auto}
.lb-item{display:flex;justify-content:space-between;padding:4px 8px;background:#fef9f0;border-radius:6px;font-size:.8rem;font-weight:700}

#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%) translateY(-70px);background:var(--ink);color:#fff;border-radius:50px;padding:8px 18px;font-size:.85rem;font-weight:700;transition:transform .25s ease;z-index:100}
#toast.show{transform:translateX(-50%) translateY(0)}

.hidden{display:none!important}
</style>
</head>
<body>

<div id="toast"></div>

<!-- ══ START PAGE ══ -->
<div class="page" id="startPage">
  <div class="top-nav">
    <button class="icon-btn" onclick="toggleLang()" id="langBtn">English 🌐</button>
    <button class="icon-btn" onclick="toggleAudio()" id="audioBtn">🔊 الصوت: ممرر</button>
  </div>

  <div class="app-title"><span id="t_title1">حساب</span> <span id="t_title2" style="color:var(--ink)">ذهني</span></div>
  
  <div class="credit-box">👨‍💻 Developer: Abdullah</div>

  <!-- Player Name Input -->
  <div class="sec-card">
    <input type="text" id="playerNameInput" placeholder="اكتب اسمك للائحة المتصدرين..." style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-family:'Cairo';font-weight:700;text-align:center">
  </div>

  <!-- Modes & Difficulty Selection -->
  <div class="select-group">
    <span class="select-label" id="t_modeLabel">اختر طور اللعب:</span>
    <div class="options-grid">
      <div class="opt-btn active" onclick="setMode('timed')" id="m_timed">⏱️ وقت (100ث)</div>
      <div class="opt-btn" onclick="setMode('endless')" id="m_endless">♾️ لا نهائي</div>
    </div>
  </div>

  <div class="select-group">
    <span class="select-label" id="t_diffLabel">اختر المستوى:</span>
    <div class="options-grid">
      <div class="opt-btn active" onclick="setDiff('easy')" id="d_easy">🟢 سهل</div>
      <div class="opt-btn" onclick="setDiff('medium')" id="d_medium">🟡 متوسط</div>
      <div class="opt-btn" onclick="setDiff('hard')" id="d_hard">🔴 صعب</div>
    </div>
  </div>

  <!-- Leaderboard Preview -->
  <div class="sec-card">
    <div class="sec-title" id="t_lbTitle">🏆 قائمة المتصدرين (Top Scores)</div>
    <div class="lb-list" id="lbList">جاري تحميل المتصدرين...</div>
  </div>

  <button class="btn-main" onclick="startGame()" id="t_startBtn">ابدأ اللعب ←</button>
</div>

<!-- ══ GAME PAGE ══ -->
<div class="page hidden" id="gamePage">
  <div class="top-strip">
    <div class="chip"><div class="cl" id="t_score">النقاط</div><div class="cv" id="scoreVal">0</div></div>
    <div class="chip"><div class="cl" id="t_timer">الوقت/المحاولات</div><div class="cv" id="timerVal">100</div></div>
    <div class="chip"><div class="cl" id="t_high">أعلى رقم</div><div class="cv" id="highVal">0</div></div>
  </div>

  <div class="q-card">
    <div class="steps-row" id="stepsRow"></div>
  </div>

  <div class="ans-display" id="ansDisplay">اختر الجواب 👇</div>
  <div class="ans-grid" id="ansGrid"></div>

  <div style="display:flex;gap:6px;width:100%">
    <button class="btn-main btn-secondary" onclick="clearSel()" id="t_clear">مسح ✕</button>
    <button class="btn-main" onclick="submitAnswer()" id="t_ok">تأكيد ✓</button>
  </div>
</div>

<!-- ══ END PAGE ══ -->
<div class="page hidden" id="endPage">
  <h2 class="app-title" id="t_gameOver">انتهت اللعبة!</h2>
  <div class="sec-card" style="text-align:center">
    <div style="font-size:1.2rem;font-weight:900" id="finalScoreTxt">النتيجة: 0</div>
  </div>
  <button class="btn-main" onclick="startGame()" id="t_again">العب مجدداً ↺</button>
  <button class="btn-main btn-secondary" onclick="showHome()" id="t_home">الرئيسية 🏠</button>
</div>

<script>
// --- YOUR FIREBASE CONFIGURATION INTEGRATED ---
const firebaseConfig = {
  apiKey: "AIzaSyAt-bzZZ16k2_v0-5WPFxFZ163BsAFKR_k",
  authDomain: "mental-math-9abfd.firebaseapp.com",
  databaseURL: "https://mental-math-9abfd-default-rtdb.firebaseio.com",
  projectId: "mental-math-9abfd",
  storageBucket: "mental-math-9abfd.firebasestorage.app",
  messagingSenderId: "1003829136515",
  appId: "1:1003829136515:web:cdc6f3a84486e6f61d1fb6",
  measurementId: "G-R3D137GLJF"
};

// Initialize Firebase
let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
} catch(e) { console.log("Firebase Error:", e); }

// --- GAME LOGIC & TRANSLATIONS ---
let lang = 'ar';
let audioEnabled = true;
let selectedMode = 'timed';
let selectedDiff = 'easy';
let score = 0, lives = 3, timeLeft = 100, timerInterval = null;
let correctAnswer = 0, selected = null;

const dict = {
  ar: {
    t1: "حساب", t2: "ذهني", modeL: "اختر طور اللعب:", diffL: "اختر المستوى:",
    lb: "🏆 قائمة المتصدرين", start: "ابدأ اللعب ←", score: "النقاط", timer: "الوقت/المحاولات",
    high: "أعلى رقم", clear: "مسح ✕", ok: "تأكيد ✓", over: "انتهت اللعبة!", again: "العب مجدداً ↺",
    home: "الرئيسية 🏠", enterName: "يرجى كتابة اسمك أولاً!"
  },
  en: {
    t1: "Mental", t2: "Math", modeL: "Select Mode:", diffL: "Select Difficulty:",
    lb: "🏆 Leaderboard", start: "Start Game ←", score: "Score", timer: "Time/Lives",
    high: "High Score", clear: "Clear ✕", ok: "Submit ✓", over: "Game Over!", again: "Play Again ↺",
    home: "Home 🏠", enterName: "Please enter your name first!"
  }
};

function toggleLang(){
  lang = lang === 'ar' ? 'en' : 'ar';
  document.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('langBtn').textContent = lang === 'ar' ? 'English 🌐' : 'عربي 🌐';
  applyLang();
}

function applyLang(){
  const d = dict[lang];
  document.getElementById('t_title1').textContent = d.t1;
  document.getElementById('t_title2').textContent = d.t2;
  document.getElementById('t_modeLabel').textContent = d.modeL;
  document.getElementById('t_diffLabel').textContent = d.diffL;
  document.getElementById('t_lbTitle').textContent = d.lb;
  document.getElementById('t_startBtn').textContent = d.start;
  document.getElementById('t_score').textContent = d.score;
  document.getElementById('t_timer').textContent = d.timer;
  document.getElementById('t_high').textContent = d.high;
  document.getElementById('t_clear').textContent = d.clear;
  document.getElementById('t_ok').textContent = d.ok;
  document.getElementById('t_gameOver').textContent = d.over;
  document.getElementById('t_again').textContent = d.again;
  document.getElementById('t_home').textContent = d.home;
}

function toggleAudio(){
  audioEnabled = !audioEnabled;
  document.getElementById('audioBtn').textContent = audioEnabled ? (lang==='ar'?'🔊 الصوت: ممرر':'🔊 Sound: ON') : (lang==='ar'?'🔇 الصوت: مكتوم':'🔇 Sound: OFF');
}

function vibrate(ms){
  if(navigator.vibrate) navigator.vibrate(ms);
}

function setMode(m){
  selectedMode = m;
  document.getElementById('m_timed').classList.toggle('active', m==='timed');
  document.getElementById('m_endless').classList.toggle('active', m==='endless');
}

function setDiff(d){
  selectedDiff = d;
  document.getElementById('d_easy').classList.toggle('active', d==='easy');
  document.getElementById('d_medium').classList.toggle('active', d==='medium');
  document.getElementById('d_hard').classList.toggle('active', d==='hard');
}

function buildGrid(){
  const g = document.getElementById('ansGrid'); g.innerHTML = '';
  const max = selectedDiff === 'easy' ? 35 : selectedDiff === 'medium' ? 50 : 99;
  for(let i=0; i<=max; i++){
    const b = document.createElement('button');
    b.className = 'ans-btn';
    b.textContent = i;
    b.id = 'ab' + i;
    b.onclick = () => selectAnswer(i);
    g.appendChild(b);
  }
}

function selectAnswer(val){
  if(selected!==null){ const p=document.getElementById('ab'+selected); if(p) p.classList.remove('selected'); }
  selected = val;
  const b = document.getElementById('ab'+val); if(b) b.classList.add('selected');
  document.getElementById('ansDisplay').textContent = val;
  document.getElementById('ansDisplay').className = 'ans-display has-val';
}

function clearSel(){
  if(selected!==null){ const b=document.getElementById('ab'+selected); if(b) b.classList.remove('selected'); selected=null; }
  document.getElementById('ansDisplay').textContent = 'اختر الجواب 👇';
  document.getElementById('ansDisplay').className = 'ans-display';
}

function generateQuestion(){
  let a = Math.floor(Math.random() * 10) + 1;
  let b = Math.floor(Math.random() * 10) + 1;
  let op = '+';

  if(selectedDiff === 'medium'){
    op = Math.random() > 0.5 ? '+' : '-';
  } else if(selectedDiff === 'hard'){
    const ops = ['+', '-', '*'];
    op = ops[Math.floor(Math.random() * ops.length)];
  }

  if(op === '-' && a < b) [a, b] = [b, a];
  correctAnswer = op === '+' ? a + b : op === '-' ? a - b : a * b;

  const row = document.getElementById('stepsRow');
  row.innerHTML = `<span class="step-num">${a}</span><span class="step-op ${op==='+'?'plus':op==='-'?'minus':'mul'}">${op==='*'? '×' : op}</span><span class="step-num">${b}</span><span class="step-num">= ؟</span>`;
  clearSel();
}

function submitAnswer(){
  if(selected === null) return;
  if(selected === correctAnswer){
    score++;
    vibrate(50);
    toast("✓ صحيح", "green");
  } else {
    vibrate([100, 50, 100]);
    toast("✗ خطأ", "red");
    if(selectedMode === 'endless'){
      lives--;
      if(lives <= 0) return endGame();
    } else {
      score = Math.max(0, score - 2);
    }
  }
  updateUI();
  generateQuestion();
}

function updateUI(){
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('timerVal').textContent = selectedMode === 'timed' ? timeLeft : '❤️ ' + lives;
}

function startGame(){
  const name = document.getElementById('playerNameInput').value.trim();
  if(!name){ alert(dict[lang].enterName); return; }

  score = 0; lives = 3; timeLeft = 100;
  document.getElementById('startPage').classList.add('hidden');
  document.getElementById('endPage').classList.add('hidden');
  document.getElementById('gamePage').classList.remove('hidden');

  buildGrid();
  updateUI();
  generateQuestion();

  if(selectedMode === 'timed'){
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      updateUI();
      if(timeLeft <= 0) endGame();
    }, 1000);
  }
}

function endGame(){
  clearInterval(timerInterval);
  document.getElementById('gamePage').classList.add('hidden');
  document.getElementById('endPage').classList.remove('hidden');
  document.getElementById('finalScoreTxt').textContent = (lang==='ar'?'النتيجة: ':'Score: ') + score;

  saveScore(document.getElementById('playerNameInput').value.trim(), score);
}

function showHome(){
  document.getElementById('endPage').classList.add('hidden');
  document.getElementById('startPage').classList.remove('hidden');
  loadLeaderboard();
}

function toast(msg, color){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = color === 'green' ? 'var(--green)' : 'var(--red)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1200);
}

// --- FIREBASE LEADERBOARD FUNCTIONS ---
function saveScore(name, sc){
  if(!db || sc <= 0) return;
  db.ref('leaderboard').push({ name: name, score: sc, date: Date.now() });
}

function loadLeaderboard(){
  if(!db) { document.getElementById('lbList').innerHTML = "لم يتم الربط بـ Firebase"; return; }
  db.ref('leaderboard').orderByChild('score').limitToLast(5).on('value', snapshot => {
    const list = document.getElementById('lbList');
    list.innerHTML = '';
    let items = [];
    snapshot.forEach(cs => { items.push(cs.val()); });
    items.reverse().forEach((item, index) => {
      list.innerHTML += `<div class="lb-item"><span>${index+1}. ${item.name}</span><span>${item.score} pts</span></div>`;
    });
    if(items.length === 0) list.innerHTML = "لا توجد نتائج بعد، كن أول المتصدرين!";
  });
}

loadLeaderboard();
</script>
</body>
</html>
